name: Android CI
# :core runs everywhere; :app needs the Android SDK that GitHub's ubuntu runners provide (ANDROID_HOME).
on:
  push:
    branches: [main, 'ccr-*', 'claude/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core + app), lint, APKs
        run: |
          set -o pipefail
          chmod +x gradlew
          CODE=$((100 + $(git rev-list --count HEAD)))
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease -PversionCodeOverride=$CODE --stacktrace 2>&1 | tee build.log
      - name: Failure summary (keeps CI logs cheap to read)
        if: failure()
        run: |
          echo "=== FAILURE SUMMARY BEGIN ==="
          grep -E "^e: |Test .*FAILED|AssertionError|FAILURE: Build failed|error:" build.log | cut -c1-300 | head -40 || true
          awk '/What went wrong/{f=1} f{print; n++} n>10{exit}' build.log | cut -c1-300 || true
          grep -E "^e: |Test .*FAILED|AssertionError|What went wrong|Execution failed" build.log | cut -c1-250 | head -12 | while read -r l; do echo "::error::${l}"; done || true
          echo "=== FAILURE SUMMARY END ==="
      - name: Lint report (printed because Gradle only prints a count)
        if: failure()
        run: |
          f=app/build/reports/lint-results-debug.txt
          [ -f "$f" ] && head -80 "$f" || true
      - name: Name the APK (version + commit)
        run: |
          VER=$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=$(git rev-parse --short HEAD)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ClockWise-v${VER}-${SHA}-debug.apk"
          echo "Built ClockWise v${VER} @ ${SHA}"
      - name: Signing certificate (must stay identical across builds)
        run: keytool -printcert -jarfile dist/*-debug.apk | grep -E 'SHA256|Owner' || true
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: dist/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
