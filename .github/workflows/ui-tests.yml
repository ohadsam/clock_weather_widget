name: UI tests (emulator + screenshots)
# Runs the Compose UI tests on an Android emulator and uploads the screenshots taken by ScreenshotJourneyTest as an artifact.
# An emulator run takes ~10 minutes, so it runs only when the UI tests or this file change (push to main), or by hand.
# NOTE: the repository's default branch is not main, and GitHub lists "Run workflow" only for workflows on the default branch;
# so the push trigger below is the reliable way to start it (touch a file under app/src/androidTest/ or this workflow).
on:
  push:
    branches: [main]
    paths:
      - 'app/src/androidTest/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest -PversionCodeOverride=1 --stacktrace
            mkdir -p shots && adb pull /sdcard/Android/data/com.clockweather.app/files/screenshots shots/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
