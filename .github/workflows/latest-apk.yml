name: Publish latest APK
# On every push to main: build the signed release APK and republish it as the pre-release "latest".
# The new APK must be an in-place UPDATE of the previously published one: same applicationId, same signing
# certificate, higher versionCode - otherwise the job fails and nothing is published.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          CODE=$((100 + $(git rev-list --count HEAD)))
          ./gradlew :core:test :app:assembleRelease -PversionCodeOverride=$CODE --stacktrace
      - name: Build Wear OS tile APK (best effort: a watch build problem never blocks the phone release)
        id: wear
        continue-on-error: true
        run: |
          CODE=$((100 + $(git rev-list --count HEAD)))
          ./gradlew :wear:assembleRelease -PversionCodeOverride=$CODE --stacktrace
          cp "$(ls wear/build/outputs/apk/release/*.apk | head -1)" ClockWiseWear.apk
      - name: Verify in-place update against the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          NEW=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p old && cd old
          if gh release download latest --pattern 'ClockWise.apk' --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            OLD=$(ls *.apk | head -1); cd ..
            cert() { "$BT/apksigner" verify --print-certs "$1" | grep -m1 'SHA-256 digest'; }
            pkg()  { "$BT/aapt2" dump badging "$1" | grep -m1 -oE "package: name='[^']+'" ; }
            code() { "$BT/aapt2" dump badging "$1" | grep -m1 -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+'; }
            [ "$(cert old/$OLD)" = "$(cert $NEW)" ] || { echo "::error::Signing certificate changed - the update would not install"; exit 1; }
            [ "$(pkg old/$OLD)" = "$(pkg $NEW)" ] || { echo "::error::applicationId changed"; exit 1; }
            [ "$(code $NEW)" -gt "$(code old/$OLD)" ] || { echo "::error::versionCode did not increase"; exit 1; }
            echo "In-place update verified."
          else
            cd ..; echo "No previous 'latest' release: first publish."
          fi
      - name: Publish release "latest" (stable file names so the in-app updater can find them)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=$(git rev-parse --short HEAD)
          CODE=$((100 + $(git rev-list --count HEAD)))
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$SRC" ClockWise.apk
          HASH=$(sha256sum ClockWise.apk | cut -d' ' -f1)
          echo "$HASH  ClockWise.apk" > ClockWise.apk.sha256
          NOTES=$(awk -v v="$VER" '$0 ~ "^## "v"$" {f=1; next} /^## / {f=0} f' docs/CHANGELOG.md | tr '\n' ' ' | sed 's/"/\\"/g' | cut -c1-380)
          printf '{"versionName":"%s","versionCode":%s,"sha":"%s","sha256":"%s","apk":"https://github.com/%s/releases/download/latest/ClockWise.apk","notes":"%s"}\n' "$VER" "$CODE" "$SHA" "$HASH" "$GITHUB_REPOSITORY" "$NOTES" > version.json
          python3 -c "import json;d=json.load(open('version.json'));print('version.json ok',d['versionName'],d['versionCode'])"
          gh release delete latest --yes --cleanup-tag || true
          EXTRA=''; [ -f ClockWiseWear.apk ] && EXTRA='ClockWiseWear.apk'
          gh release create latest ClockWise.apk ClockWise.apk.sha256 version.json $EXTRA --prerelease --target "$GITHUB_SHA" \
            --title "Latest build v${VER} (${SHA})" \
            --notes "Automatic build of main @ ${SHA}. Sideload-signed: installs over any previous build of this app. Use Settings -> Updates in the app to update."
